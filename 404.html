<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>404</title>
  <link rel="shortcut icon" href="assets/logo.png" type="image/png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #b0b0b0;
            font-family: Arial, sans-serif;
        }
        .page {
            position: relative;
            width: 100%;
            text-align: center;
        }
        .page h1 {
            font-size: clamp(6rem, 20vw, 18rem);
            margin: 0;
            line-height: 0.9;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>404</h1>
    </div>
    <script>
      (function() {
        const supportedLangs = ['ar', 'en'];
        const match = location.pathname.match(/^\/(ar|en)(\/.*)?$/);
        if (match) {
          const lang = match[1];
          const path = match[2] || '/index.html';
          const cleanPath = path === '/' ? '/index.html' : path;
          location.replace(cleanPath + '?lang=' + lang + location.hash);
        }
      })();
    </script>
    <script src="i18n.js"></script>
</body>
</html>
